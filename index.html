<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro-tv</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div>
      <main>
        <div>
          <!-- tv-outer -->
          <div>
            <!-- tv-inner -->
            <section>
              <img
                src="https://media1.tenor.com/m/s4JY3lm0L-4AAAAd/deep-ocean.gif"
                alt="channel1"
              />
              <img
                src="https://media1.tenor.com/m/JBDbmSj3nUwAAAAC/waves.gif"
                alt="channel2"
              />
              <img
                src="https://media1.tenor.com/m/T_S2VJZE8l0AAAAd/ocean-waves.gif"
                alt="channel3"
              />
              <img
                src="https://media1.tenor.com/m/eQDuTRTKWDcAAAAd/waves-ocean.gif"
                alt="channel4"
              />
              <!-- <img
                src="https://media1.tenor.com/m/JxsJwNo3gcEAAAAC/sea-beach.gif"
                alt="channel5"
              /> -->
            </section>
            <!-- tv-screen -->
            <aside>
              <!-- tv-sidepanel -->
              <div>
                <!-- tv-buttonarea1 -->

                <!-- channelKnob -->
                <label>
                  <input
                    type="range"
                    name="channel"
                    step="50"
                    value="0"
                    min="0"
                    max="200"
                  />
                  <div>3</div>
                  <div>4</div>
                  <div>5</div>
                  <div>1</div>
                  <div>2</div>
                </label>
                <!-- filters -->
                <!-- <div>
                  <input type="radio" name="filter" id="grayscale" />
                  <input type="radio" name="filter" id="contrast" />
                  <input type="radio" name="filter" id="fry" />
                </div> -->

                <div>
                  <input type="checkbox" name="power" id="power" />
                </div>
              </div>
              <!-- tv-buttonarea2 -->
              <!-- <div>
                <input type="radio" name="volume" />
               <input type="radio" name="volume" />
              </div> -->
              <!-- speaker -->
              <div></div>
            </aside>
          </div>
        </div>
        <div>
          <div></div>
          <div></div>
        </div>
      </main>
    </div>
    <!-- tv-stand -->
    <!-- <div></div> -->
  </body>
</html>
